# bincms — static site, built from its own repo's Dockerfile.
# nginx:alpine serving the repo root as-is (no custom nginx.conf).
#
# Source code is cloned to ./src by scripts/40-deploy-stacks.sh.
services:
  web:
    build: ./src
    image: bincms:local
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # HTTP — this is what cloudflared hands traffic to.
      - "traefik.http.routers.bincms.rule=Host(`bincms.dev`) || Host(`www.bincms.dev`)"
      - traefik.http.routers.bincms.entrypoints=web
      - traefik.http.routers.bincms.service=bincms
      # HTTPS at the origin. Unused for public traffic (Cloudflare terminates
      # TLS) but kept so the site works if the tunnel is ever bypassed.
      - "traefik.http.routers.bincms-secure.rule=Host(`bincms.dev`) || Host(`www.bincms.dev`)"
      - traefik.http.routers.bincms-secure.entrypoints=websecure
      - traefik.http.routers.bincms-secure.service=bincms
      - traefik.http.routers.bincms-secure.tls=true
      - traefik.http.routers.bincms-secure.tls.certresolver=letsencrypt
      - traefik.http.services.bincms.loadbalancer.server.port=80

networks:
  proxy:
    external: true
