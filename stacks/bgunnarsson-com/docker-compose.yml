# bgunnarsson-com — static site, built from its own repo's Dockerfile.
# nginx:alpine + custom nginx.conf; ships index.html, terminal.js, og.png.
#
# Source code is cloned to ./src by scripts/40-deploy-stacks.sh.
services:
  web:
    build: ./src
    image: bgunnarsson-com:local
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # HTTP — this is what cloudflared hands traffic to.
      - "traefik.http.routers.bgunnarsson-com.rule=Host(`bgunnarsson.com`) || Host(`www.bgunnarsson.com`)"
      - traefik.http.routers.bgunnarsson-com.entrypoints=web
      - traefik.http.routers.bgunnarsson-com.service=bgunnarsson-com
      # HTTPS at the origin. Unused for public traffic (Cloudflare terminates
      # TLS) but kept so the site works if the tunnel is ever bypassed.
      - "traefik.http.routers.bgunnarsson-com-secure.rule=Host(`bgunnarsson.com`) || Host(`www.bgunnarsson.com`)"
      - traefik.http.routers.bgunnarsson-com-secure.entrypoints=websecure
      - traefik.http.routers.bgunnarsson-com-secure.service=bgunnarsson-com
      - traefik.http.routers.bgunnarsson-com-secure.tls=true
      - traefik.http.routers.bgunnarsson-com-secure.tls.certresolver=letsencrypt
      - traefik.http.services.bgunnarsson-com.loadbalancer.server.port=80

networks:
  proxy:
    external: true
