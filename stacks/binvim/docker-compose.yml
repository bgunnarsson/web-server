# binvim — static site, built from its own repo's Dockerfile.
# Two-stage: vite build (node:22-alpine, pnpm) then nginx:alpine.
#
# Source code is cloned to ./src by scripts/40-deploy-stacks.sh.
services:
  web:
    build: ./src
    image: binvim:local
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # HTTP — this is what cloudflared hands traffic to.
      - "traefik.http.routers.binvim.rule=Host(`binvim.dev`) || Host(`www.binvim.dev`)"
      - traefik.http.routers.binvim.entrypoints=web
      - traefik.http.routers.binvim.service=binvim
      # HTTPS at the origin. Unused for public traffic (Cloudflare terminates
      # TLS) but kept so the site works if the tunnel is ever bypassed.
      - "traefik.http.routers.binvim-secure.rule=Host(`binvim.dev`) || Host(`www.binvim.dev`)"
      - traefik.http.routers.binvim-secure.entrypoints=websecure
      - traefik.http.routers.binvim-secure.service=binvim
      - traefik.http.routers.binvim-secure.tls=true
      - traefik.http.routers.binvim-secure.tls.certresolver=letsencrypt
      - traefik.http.services.binvim.loadbalancer.server.port=80

networks:
  proxy:
    external: true
