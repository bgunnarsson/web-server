# penpot (design.bgunnarsson.dev) — self-hosted design tool.
#
# TAILNET-ONLY. This hostname must never be published through a Cloudflare
# tunnel or given a proxied CNAME. Its DNS is a DNS-only (grey-cloud) A record
# pointing at the host's Tailscale IP, and Traefik serves it on :443 with a real
# Let's Encrypt cert issued over DNS-01. The tailnet is the only access control.
# See docs/05-dns-cloudflare.md.
#
# All images come from Docker Hub — nothing to clone. Pinned to 2.17.0, the
# version running on robco (the upstream compose defaults to 2.16).
x-flags: &flags
  PENPOT_FLAGS: ${PENPOT_FLAGS:-disable-registration disable-email-verification enable-prepl-server}
x-uri: &uri
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-https://design.bgunnarsson.dev}
x-body-size: &body
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600
x-secret-key: &secret
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set in stacks/penpot/.env}

services:
  penpot-frontend:
    image: penpotapp/frontend:${PENPOT_VERSION:-2.17.0}
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
    networks:
      - penpot
      - proxy
    environment:
      <<: [*flags, *body, *uri]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # HTTPS only: nothing reaches this over plain HTTP from the internet, and
      # tailnet clients use https:// so PENPOT_PUBLIC_URI stays correct.
      - "traefik.http.routers.penpot.rule=Host(`design.bgunnarsson.dev`)"
      - traefik.http.routers.penpot.entrypoints=websecure
      - traefik.http.routers.penpot.service=penpot
      - traefik.http.routers.penpot.tls=true
      - traefik.http.routers.penpot.tls.certresolver=letsencrypt
      - traefik.http.services.penpot.loadbalancer.server.port=8080

  penpot-backend:
    image: penpotapp/backend:${PENPOT_VERSION:-2.17.0}
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      <<: [*flags, *uri, *body, *secret]
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: ${POSTGRES_USER:-penpot}
      PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in stacks/penpot/.env}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: ${PENPOT_TELEMETRY_ENABLED:-true}
      PENPOT_TELEMETRY_REFERER: compose
      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST:-}
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT:-587}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME:-}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD:-}
      PENPOT_SMTP_TLS: ${PENPOT_SMTP_TLS:-true}
      PENPOT_SMTP_SSL: ${PENPOT_SMTP_SSL:-false}

  penpot-exporter:
    image: penpotapp/exporter:${PENPOT_VERSION:-2.17.0}
    restart: always
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      <<: [*secret]
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-mcp:
    image: penpotapp/mcp:${PENPOT_VERSION:-2.17.0}
    restart: always
    networks:
      - penpot

  penpot-postgres:
    image: postgres:15
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: ${POSTGRES_USER:-penpot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in stacks/penpot/.env}

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu

volumes:
  penpot_postgres_v15:
  penpot_assets:

networks:
  penpot:
  proxy:
    external: true
