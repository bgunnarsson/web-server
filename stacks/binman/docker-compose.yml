# binman — static site, built from its own repo's Dockerfile.
# nginx:alpine serving the repo root as-is.
#
# Source code is cloned to ./src by scripts/40-deploy-stacks.sh.
services:
  web:
    build: ./src
    image: binman:local
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # HTTP — this is what cloudflared hands traffic to.
      - "traefik.http.routers.binman.rule=Host(`binman.is`) || Host(`www.binman.is`)"
      - traefik.http.routers.binman.entrypoints=web
      - traefik.http.routers.binman.service=binman
      # HTTPS at the origin. Unused for public traffic (Cloudflare terminates
      # TLS) but kept so the site works if the tunnel is ever bypassed.
      - "traefik.http.routers.binman-secure.rule=Host(`binman.is`) || Host(`www.binman.is`)"
      - traefik.http.routers.binman-secure.entrypoints=websecure
      - traefik.http.routers.binman-secure.service=binman
      - traefik.http.routers.binman-secure.tls=true
      - traefik.http.routers.binman-secure.tls.certresolver=letsencrypt
      - traefik.http.services.binman.loadbalancer.server.port=80

networks:
  proxy:
    external: true
