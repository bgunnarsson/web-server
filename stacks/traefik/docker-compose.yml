# Edge router. Bring this up FIRST — every site stack joins the `proxy`
# network it fronts.
services:
  traefik:
    image: traefik:v3.6.7          # pinned to the version robco ran
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"              # HTTP/3
    environment:
      # Let's Encrypt DNS-01. Scopes: Zone:DNS:Edit + Zone:Zone:Read, all zones.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in stacks/traefik/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic
    networks:
      - proxy

networks:
  proxy:
    external: true
